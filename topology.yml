---
name: campus
provider: clab

defaults.device: iol

defaults.devices:
  iol.clab.image: asifsyd/cisco_iol:17.12.01

defaults.providers.clab.attributes.node._keys:
  binds: list

module: [ospf]

nodes:
  R1:
  R2:
  R3:
  R4:
  jenkins:
    device: linux
    skip_config: [initial, routing]
    clab:
      image: jenkins/jenkins:lts
      binds:
        - /home/zulu/netlab-jenkins-ci/jenkins_home:/var/jenkins_home
        - /var/run/docker.sock:/var/run/docker.sock
      exec:
        - sh -c 'groupadd -g 984 docker-host || true && usermod -aG 984 jenkins'
      ports:
        - "8080:8080"
        - "50000:50000"
  agent1:
    device: linux
    skip_config: [initial, routing]
    clab:
      image: jenkins/ssh-agent:alpine-jdk25
      binds:
        - /home/zulu/.ssh/jenkins_agent_key.pub:/home/jenkins/.ssh/authorized_keys:ro

links:
  - R1-R3
  - R3-R2
  - R2-R4
  - R4-R1
  - R1-jenkins

